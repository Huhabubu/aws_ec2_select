name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ libssl-dev
      - name: Configure
        run: cmake -S probe -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: |
          set +e
          ./build/latency_probe --market nope
          code=$?
          set -e
          test "$code" -eq 64
          ./build/latency_probe --help || test "$?" -eq 64
